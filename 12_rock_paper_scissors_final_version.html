<!DOCTYPE html>
<html>

<head>
    <title> Final: Rock Paper Scissors </title>
    <link rel="stylesheet" href="styles/12_rock_paper_scissors_final_version.css">
    <style>
        /*css is above*/
        /* Final version
            1, adding refined keydown logic, parallal to the click.
            2, make a rule table to replace the if-else statements
            3, a clearer structure for the whole project
            4, 12-exercise, adding confirm message when reset
            5, change autoplay to stop as clicked.
        */
    </style>
</head>

<body>
    <!--html -->
    <h3 class="title"> Rock Paper Scissors </h3>

    <button data-action='move' data-user_move="rock" class="move-btn"> 
        <img src="images/10-rock-emoji.png" class="move-icon"> 
    </button>
    <button data-action='move' data-user_move="paper" class="move-btn"> 
        <img src="images/10-paper-emoji.png" class="move-icon"> 
    </button>
    <button data-action='move' data-user_move="scissors" class="move-btn"> 
        <img src="images/10-scissors-emoji.png" class="move-icon"> 
    </button>
    <!-- we need to add a button and then using it to update the score-->
    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-moves2"></p>
    <div id="scoreboard" class="scoreboard">Wins: 0 | Losses: 0 | Ties: 0</div>
    <button data-action='reset' id="reset-btn" class="reset-btn js-reset-btn"> Reset Score</button>
    <button data-action='autoplay' id="autoplay-btn" class="autoplay-btn js-autoplay-btn"> Auto Play</button>
    <!-- adding confirm before really reset to 0-->
    <div class="double-check-reset-grid js-double-check-reset-grid hidden">
        <p class="js-reset-confirm">Are you sure you want to reset the score?</p>
        <button data-action='reset-y' class="js-reset-yes reset-yes">Yes</button>
        <button data-action='reset-n'class="js-reset-no reset-no">No</button>
    </div>

    <script src="scripts/12_rock_paper_scissors_final_version.js">
        // js code, to load
    </script>
</body>

</html>
